user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # Upstream servers
    upstream aio_file_server {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream aio_exec_server {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # HTTP（可用于应急或未启用 TLS 时；生产 TLS 见 sites-enabled 中 HTTPS 块，默认 Let's Encrypt）
    server {
        listen 80;
        server_name mcp.univoices.club;
        
        # 可选 ACME 校验路径
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        
        # File upload routes (original path)
        location /upload/ {
            limit_req zone=upload burst=20 nodelay;
            
            proxy_pass http://aio_file_server;
            
            # Handle large file uploads
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # API routes (new path)
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://aio_file_server;
            
            # Handle large file uploads
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # MCP execution routes
        location /api/v1/mcp/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://aio_exec_server;
            
            # Handle large file uploads
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Health check
        location /health {
            proxy_pass http://aio_file_server;
        }

        # Root path
        location / {
            return 200 'AIO-Pod Server is running at mcp.univoices.club\nUse /upload/ or /api/v1/ endpoints for API access.';
            add_header Content-Type text/plain;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
} 