user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    # CF 回源 TLS 首包过小：tcp_nopush on 可能推迟首个 TLS 记录发出（与抓包「仅有 TCP ACK、无 ServerHello」并存时建议 off）
    tcp_nopush off;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # Upstream servers
    upstream aio_file_server {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream aio_exec_server {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # MCP / webchat 等虚拟主机：仓库内 nginx/sites-available/mcp.univoices.club 由 setup_nginx_ssl.sh 安装并启用
    include /etc/nginx/sites-enabled/*;
} 