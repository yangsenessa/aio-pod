# Nginx Configuration for Chat Router (OpenAI-Compatible API)
# Domain: webchat.univoices.club
# Backend: http://127.0.0.1:8002


# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name webchat.univoices.club;
    
    # ACME HTTP-01（可选；经 Cloudflare 代理时常配合 DNS-01 或直接使用 Origin 证书）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 配置
server {
    # Cloudflare 回源需 ALPN（含 h2）；勿 http2 off（易 525）。nginx ≥1.25.1；更旧请用 listen 443 ssl http2
    listen 443 ssl;
    http2 on;
    server_name webchat.univoices.club;

    # Let's Encrypt（与 MCP 虚拟主机共用通配符时路径一致；否则改 LE_TLS_* / 本文件路径）
    ssl_certificate /etc/letsencrypt/live/univoices.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/univoices.club/privkey.pem;
    
    ssl_early_data off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL 会话缓存
    ssl_session_cache shared:SSL_CHAT:10m;
    ssl_session_timeout 10m;
    ssl_ecdh_curve auto;

    # 日志配置
    access_log /var/log/nginx/webchat.univoices.club_access.log;
    error_log /var/log/nginx/webchat.univoices.club_error.log;

    # 客户端最大请求体大小（聊天 API 通常不需要太大）
    client_max_body_size 10M;

    # OpenAI API 端点
    location /v1/ {
        proxy_pass http://127.0.0.1:8002/v1/;
        proxy_http_version 1.1;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（用于流式响应）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置（聊天可能需要较长时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 流式响应需要关闭缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        
        # SSE (Server-Sent Events) 支持
        proxy_set_header Cache-Control 'no-cache';
        
        # CORS 仅由上游 Chat Router（FastAPI CORSMiddleware）输出。此处勿 add_header CORS，
        # 否则与上游重复，浏览器会报 Access-Control-Allow-Origin: *, * 并拦截。
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:8002/health;
        access_log off;
    }
    
    # 根路径重定向到文档或状态页
    location = / {
        return 302 /health;
    }
}
